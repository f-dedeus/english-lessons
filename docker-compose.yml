services:
  db:
    image: postgres:17
    container_name: english-lessons-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: english
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d english']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: